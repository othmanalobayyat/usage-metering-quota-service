services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: quota
      POSTGRES_PASSWORD: quota
      POSTGRES_DB: quota
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quota -d quota"]
      interval: 2s
      timeout: 3s
      retries: 15

  api:
    build: .
    environment:
      DATABASE_URL: postgres://quota:quota@db:5432/quota
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    # /healthz checks the DB too. start_period covers migrate + seed in the entrypoint.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/healthz').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s
      start_interval: 1s

  client:
    build: ./client
    environment:
      QUOTA_API_URL: http://api:3000
      PORT: 8080
    ports:
      - "${CLIENT_PORT:-8081}:8080"
    depends_on:
      api:
        condition: service_healthy

volumes:
  db-data:
