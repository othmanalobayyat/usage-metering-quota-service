services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: quota
      POSTGRES_PASSWORD: quota
      POSTGRES_DB: quota
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quota -d quota"]
      interval: 2s
      timeout: 3s
      retries: 15

  api:
    build: .
    environment:
      DATABASE_URL: postgres://quota:quota@db:5432/quota
      PORT: 3000
      # API processes (node:cluster), each with its own pool of 10. The default, 1, runs a single
      # process; more helps many accounts but slows a hot account (docs/LOAD_TEST.md §8).
      WORKERS: ${WORKERS:-1}
    # Workers force their own exit after 10s and the cluster primary SIGKILLs stragglers at 12s;
    # Docker's default 10s grace would SIGKILL everything first.
    stop_grace_period: 15s
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    # /healthz checks the DB too. start_period covers migrate + seed in the entrypoint.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/healthz').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s
      start_interval: 1s

  client:
    build: ./client
    environment:
      QUOTA_API_URL: http://api:3000
      PORT: 8080
    ports:
      - "${CLIENT_PORT:-8081}:8080"
    depends_on:
      api:
        condition: service_healthy

  # Load tests only: `docker compose --profile load run --rm k6 run /scripts/<scenario>.js`,
  # or load/run.sh <scenario>, which also collects DB and API evidence. See docs/LOAD_TEST.md.
  k6:
    image: grafana/k6:1.3.0
    profiles: ["load"]
    environment:
      BASE_URL: http://api:3000
    volumes:
      - ./load:/scripts:ro
    depends_on:
      api:
        condition: service_healthy

volumes:
  db-data:
